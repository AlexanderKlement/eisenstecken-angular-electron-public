<h1 mat-dialog-title>{{ data.title }}</h1>
<div mat-dialog-content>
  <p>{{ data.text }}</p>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">{{ data.cancelText ?? 'Abbrechen' }}</button>
  <div fxFlex></div>
  <button mat-button (click)="onYesClick()">{{ data.confirmText ?? 'Bestätigen' }}</button>
</div>
