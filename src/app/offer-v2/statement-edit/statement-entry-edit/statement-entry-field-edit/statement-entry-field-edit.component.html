<div fxLayout="row" fxLayoutAlign="start center" [formGroup]="entryFormGroup" class="field" fxLayoutGap="8">
  <mat-icon (click)="toggleAdditionSubstraction()" class="plus"
            [class.minus]="!entryFormGroup.get('additionSubstraction').value">
    @if (entryFormGroup.get("additionSubstraction").value) {
      add
    } @else {
      remove
    }
  </mat-icon>
  <mat-form-field appearance="outline" class="new-form-element fill-width">
    <mat-label>Beschreibung</mat-label>
    <input matInput formControlName="description">
  </mat-form-field>
  <mat-form-field appearance="outline" class="new-form-element">
    <mat-label>Anzahl</mat-label>
    <input matInput formControlName="amount">
  </mat-form-field>
  <mat-form-field appearance="outline" class="new-form-element">
    <mat-label>Preis</mat-label>
    <input matInput formControlName="price">
  </mat-form-field>
  <mat-icon (click)="this.deleted.emit(index)" class="delete">delete_outlined</mat-icon>
</div>
