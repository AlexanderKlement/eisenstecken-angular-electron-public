<app-offer-container subTitle="Angebote">
  <div class="center-container">
    <mat-tab-group>
      <mat-tab label="Angebote">
        <app-table-builder title="{{ offerTitle }}" [dataSource]="offerDataSource" [headerButtons]="offerHeaderButtons"
                           [buttons]="offerButtons" />
      </mat-tab>
      <mat-tab label="Aufstellungen">

        <app-table-builder title="Alle Aufstellungen" [dataSource]="statementDataSource"
                           [headerButtons]="statementHeaderButtons"
                           [buttons]="statementButtons" />
      </mat-tab>
    </mat-tab-group>
  </div>
</app-offer-container>
